name: Check the published package installs

# Upstream releases can break `pip install healthchain` with no commit on our
# side. A failed run emails the maintainer.
on:
  schedule:
    - cron: "0 6 1 * *"  # monthly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Install healthchain from PyPI and import it
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v4
    - name: Check the published package installs and imports
      run: scripts/check_install.sh healthchain
