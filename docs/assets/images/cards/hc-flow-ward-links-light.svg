<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="The same NEWS2 score of 7 at two hospitals. Site A: the score links to the stay, the stay to bed W7-N-1, the bed to area W7-N. Site B: the score, coded DEPENDENCY, links to the stay, the stay to bed WN-A01, the bed to bay A, the bay to area WEST-NORTH. resolve_reference follows each link, and each site's config translates its area to the research area North.">
