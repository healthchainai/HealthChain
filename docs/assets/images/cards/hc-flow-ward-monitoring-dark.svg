  <text x="196" y="263" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#f0edf2">load_bundle</text>
  <rect x="182" y="284" width="138" height="32" rx="16" fill="#241f2a" stroke="#e59875" stroke-width="1.5"/>
  <text x="196" y="305" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#f0edf2">validation</text>
  <rect x="182" y="326" width="138" height="32" rx="16" fill="#241f2a" stroke="#e59875" stroke-width="1.5"/>
