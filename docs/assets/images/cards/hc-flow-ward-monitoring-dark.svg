  <rect x="710" y="112" width="10" height="10" fill="#f0b49a"/>
  <rect x="722" y="124" width="10" height="10" fill="#e59875"/>
  <path d="M150 214 L178 216" stroke="#a89fb0" stroke-width="1.75" fill="none" marker-end="url(#wa1)"/>
  <path d="M150 304 C164 304 164 258 178 258" stroke="#a89fb0" stroke-width="1.75" fill="none" marker-end="url(#wa1)"/>
