<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="Ward monitoring architecture: records from a hospital FHIR API enter HealthChain, which reads them with FHIRGateway, validates them and resolves references. Inside the HealthChain boundary sits the project logic: a site config, then ward_definitions.py. HealthChainAPI serves the per-area summary to a dashboard.">
