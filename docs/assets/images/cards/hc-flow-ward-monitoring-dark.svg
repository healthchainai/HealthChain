<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-label="Ward monitoring application: FHIR data from a live API or saved files enters HealthChain, which reads and checks it with FHIRGateway, load_bundle, validation and reference resolution. Inside the HealthChain boundary, your site config maps local locations and codes and ward_definitions.py computes the measures. HealthChainAPI serves the per-area summary at GET /ward-summary to a dashboard.">
  <rect x="0" y="0" width="880" height="560" rx="16" fill="#2b2532"/>
  <g transform="translate(0,35)">
  <text x="20" y="52" font-size="16" letter-spacing="2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a89fb0">SOURCES</text>
  <text x="756" y="52" font-size="16" letter-spacing="2" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#a89fb0">USERS</text>
  <rect x="20" y="186" width="130" height="56" rx="8" fill="#241f2a" stroke="#4d4556" stroke-width="1.5"/>
  <text x="34" y="220" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#f0edf2">FHIR API</text>
  <rect x="20" y="276" width="130" height="56" rx="8" fill="#241f2a" stroke="#4d4556" stroke-width="1.5"/>
