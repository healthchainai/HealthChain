  <text x="598" y="221" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#f0edf2">HealthChainAPI</text>
  <rect x="584" y="242" width="148" height="32" rx="16" fill="#241f2a" stroke="#e59875" stroke-width="1.5"/>
  <text x="598" y="263" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#f0edf2">/ward-summary</text>
