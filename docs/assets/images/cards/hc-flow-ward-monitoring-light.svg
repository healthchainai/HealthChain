  <path d="M320 216 C336 216 336 234 352 234" stroke="#5f5866" stroke-width="1.75" fill="none" marker-end="url(#wa1)"/>
  <path d="M456 282 L456 298" stroke="#5f5866" stroke-width="1.75" fill="none" marker-end="url(#wa1)"/>
