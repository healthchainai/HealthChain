  <rect x="584" y="200" width="148" height="32" rx="16" fill="#ffffff" stroke="#e59875" stroke-width="1.5"/>
  <text x="598" y="221" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#211c26">HealthChainAPI</text>
  <rect x="584" y="242" width="148" height="32" rx="16" fill="#ffffff" stroke="#e59875" stroke-width="1.5"/>
  <text x="598" y="263" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#211c26">/ward-summary</text>
  <path d="M732 216 L752 216" stroke="#5f5866" stroke-width="1.75" fill="none" marker-end="url(#wa1)"/>
  <rect x="756" y="186" width="110" height="56" rx="8" fill="#ffffff" stroke="#c9c2cd" stroke-width="1.5"/>
  <text x="770" y="220" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#211c26">dashboard</text>
  <text x="756" y="276" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5f5866">occupancy</text>
