  <text x="370" y="242" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5f5866">locations → areas</text>
  <text x="370" y="266" font-size="14" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#5f5866">codes → variables</text>
